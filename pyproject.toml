[project]
name = "lyra-plugins"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.7.25",
    "geopandas>=1.1.3",
    "lyra-sdk",
    "lyra-utils",
    "pandarm>=0.0.5",
    "pandas>=2.3.3",
]

[tool.uv.sources]
lyra-sdk = { git = "https://github.com/RodolfoFigueroa/lyra", subdirectory = "packages/lyra_sdk", rev = "dev" }
lyra-utils = { git = "https://github.com/RodolfoFigueroa/lyra", subdirectory = "packages/lyra_utils", rev = "dev" }

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.0.260204",
    "pre-commit>=4.6.0",
    "types-geopandas>=1.1.3.20260518",
]

[project.entry-points.lyra]
tree_coverage = "lyra_plugins.processors.tree_coverage"
urbanized_area = "lyra_plugins.processors.urbanized_area"
temperature = "lyra_plugins.processors.temperature"
accessibility_jobs = "lyra_plugins.processors.accessibility_jobs"
accessibility_services = "lyra_plugins.processors.accessibility_services"
