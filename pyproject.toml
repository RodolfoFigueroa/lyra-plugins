[project]
name = "lyra-plugins"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.7.25",
    "geedim>=2.0.0",
    "geopandas>=1.1.3",
    "lyra-sdk>=0.4.0",
    "lyra-utils>=0.2.0",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "osmnx>=2.0.7",
    "pandarm>=0.0.5",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
lyra-sdk = { git = "https://github.com/RodolfoFigueroa/lyra", subdirectory = "packages/lyra_sdk" }
lyra-utils = { git = "https://github.com/RodolfoFigueroa/lyra", subdirectory = "packages/lyra_utils" }

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.0.260204",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "ruff>=0.15.12",
    "ty",
    "types-geopandas>=1.1.3.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lyra_plugins"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "PLR2004", "TD003", "FIX002"]

[tool.lyra]
factory = "lyra_plugins.definitions:create_plugin"
